<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1200" height="816">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#sticker-shadow)">
    <!-- Outer White Die-Cut Sticker Contour -->
    <path d="
      M 160,260 
      C 130,220 140,160 180,110 
      C 230,50 310,30 390,30 
      C 470,30 520,60 570,90 
      C 620,120 680,140 730,190 
      C 770,230 780,280 750,330 
      C 730,370 700,390 670,410 
      C 690,430 730,440 780,450 
      C 840,460 900,470 940,510 
      C 970,540 970,610 930,640 
      C 890,660 820,660 760,660 
      L 240,660 
      C 180,660 130,650 90,620 
      C 50,580 60,520 100,480 
      C 130,450 170,440 210,430 
      C 170,400 130,360 110,310 
      C 90,260 130,220 160,260 Z" 
      fill="#FFFFFF" 
      stroke="#FFFFFF" 
      stroke-width="32" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    />

    <!-- Main Character Body & Hood (Dark Industrial Navy #0D162B) -->
    <g fill="#0D162B">
      <!-- Welding Hood -->
      <path d="
        M 270,170 
        C 245,150 260,95 305,65 
        C 345,40 405,45 425,75 
        C 440,100 425,175 410,225 
        C 395,265 375,295 345,315 
        C 310,325 270,290 260,250 
        C 255,220 265,190 270,170 Z" 
      />

      <!-- Helmet Crown Ridges / Slits (White) -->
      <path d="
        M 315,95 C 345,85 375,85 400,95
        M 305,125 C 340,115 375,115 405,125
        M 300,155 C 335,145 370,145 405,155
        M 295,185 C 330,175 365,175 400,185" 
        stroke="#FFFFFF" 
        stroke-width="10" 
        stroke-linecap="round" 
        fill="none" 
      />

      <!-- Visor Outer Window (White) and Glass (Dark) -->
      <rect x="285" y="215" width="110" height="55" rx="16" fill="#FFFFFF" />
      <rect x="295" y="223" width="90" height="39" rx="8" fill="#0D162B" />

      <!-- Back, Shoulder and Welder Torso -->
      <path d="
        M 425,85 
        C 475,75 555,95 615,135 
        C 685,180 735,245 715,315 
        C 695,375 645,415 575,445 
        C 515,465 445,460 385,440 
        C 355,430 335,405 345,370 
        C 365,310 405,250 425,180 
        C 435,140 430,105 425,85 Z" 
      />

      <!-- Arm & Welding Glove -->
      <path d="
        M 465,290 
        C 505,320 545,365 525,415 
        C 510,445 465,470 415,480 
        C 375,465 355,430 365,395 
        C 385,345 425,310 465,290 Z" 
      />

      <!-- Hand holding Welding Torch Stinger -->
      <path d="
        M 435,420 
        C 455,400 495,410 485,445 
        C 475,475 435,490 405,475 
        C 385,465 395,435 435,420 Z" 
        fill="#FFFFFF"
      />
      <!-- Stinger Grip & Cable -->
      <path d="M 470,430 L 415,535" stroke="#0D162B" stroke-width="22" stroke-linecap="round" />
      <path d="M 480,440 C 530,470 560,540 540,610" stroke="#0D162B" stroke-width="14" stroke-linecap="round" fill="none" />
      
      <!-- Nozzle & Arc Sparks -->
      <path d="M 415,535 L 395,570" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
      <path d="M 395,570 L 385,590" stroke="#0D162B" stroke-width="10" stroke-linecap="round" />

      <!-- Sparks & Droplets -->
      <circle cx="360" cy="565" r="8" fill="#0D162B" />
      <circle cx="375" cy="535" r="6" fill="#0D162B" />
      <circle cx="340" cy="590" r="7" fill="#0D162B" />
      <circle cx="350" cy="620" r="5" fill="#0D162B" />
      <circle cx="395" cy="625" r="6" fill="#0D162B" />
      <circle cx="425" cy="605" r="5" fill="#0D162B" />
      <path d="M 385,575 L 350,550 M 380,590 L 330,600 M 395,595 L 375,640" stroke="#0D162B" stroke-width="4" stroke-linecap="round" />

      <!-- Dynamic White Muscle & Jacket Crease Highlights -->
      <path d="M 475,130 C 535,160 585,215 595,285" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none" />
      <path d="M 535,115 C 605,145 665,205 675,285" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 615,225 C 655,275 665,335 635,395" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M 465,225 C 505,255 535,315 515,365" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 395,315 C 435,345 445,395 435,425" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M 275,275 C 265,345 325,415 385,445" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 235,210 C 205,245 195,305 215,365" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 205,320 C 185,365 215,425 265,475" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none" />
    </g>

    <!-- OSTAC Bold Typographic Banner (Sticker Style with Thick White Outline) -->
    <!-- White outline text for spacing and solid border -->
    <text x="545" y="630" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" font-size="200" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linejoin="round" text-anchor="middle" letter-spacing="1">OSTAC</text>

    <!-- Deep Navy Blue Text -->
    <text x="545" y="630" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" font-size="200" fill="#0D162B" text-anchor="middle" letter-spacing="1">OSTAC</text>
  </g>
</svg>